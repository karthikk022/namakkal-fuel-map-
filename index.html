<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Namakkal Live Fuel Map - Petrol Diesel CNG</title>
<meta name="description" content="Live fuel prices for Namakkal, Tamil Nadu. Find petrol, diesel, CNG bunks with real-time availability, truck parking, and SOS contacts." />
<meta property="og:title" content="Namakkal Live Fuel Map" />
<meta property="og:description" content="Live petrol, diesel, CNG prices with real-time availability for Namakkal district." />
<meta property="og:type" content="website" />
<meta property="og:image" content="https://namakkal-fuel-map.vercel.app/og-image.png" />
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>⛽</text></svg>" />
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<link rel="stylesheet" href="https://unpkg.com/leaflet-routing-machine@3.2.12/dist/leaflet-routing-machine.css" />
<link href="https://unpkg.com/maplibre-gl@5/dist/maplibre-gl.css" rel="stylesheet" />
<link rel="stylesheet" href="styles.css" />
</head>
<body>

<!-- Loading Skeleton -->
<div id="loader">
  <div class="loader-card">
    <div class="loader-icon">⛽</div>
    <div class="loader-title">Namakkal Fuel Map</div>
    <div class="loader-bar"><div class="loader-shimmer"></div></div>
    <div class="loader-text">Loading live prices...</div>
  </div>
</div>

<header>
  <div class="brand">
    <div class="logo">⛽</div>
    <div>
      <h1>Namakkal <span>Fuel Map</span></h1>
      <div id="priceBar"></div>
    </div>
  </div>
  <div class="header-right">
    <button id="darkToggle" class="dark-toggle" title="Toggle dark mode">🌙</button>
  </div>
</header>
<nav class="filters" id="filtersNav">
    <button data-f="all" class="active">All</button>
    <button data-f="petrol">Petrol</button>
    <button data-f="diesel">Diesel</button>
    <button data-f="cng">CNG</button>
    <button data-f="ev">⚡ EV</button>
    <span class="filter-sep"></span>
    <button id="nearBtn">📍 Nearest</button>
    <button id="truckMode">🚛 Trucker</button>
    <button id="trendBtn">📈 Trend</button>
    <span class="filter-sep"></span>
    <button id="sosBtn" class="btn-sos">🆘 SOS</button>
  </nav>

<main>
  <div id="mapWrap">
    <div id="map"></div>
    <div id="mapOverlay" class="map-overlay hidden">
      <div class="map-overlay-content">
        <div class="map-overlay-icon">📍</div>
        <div class="map-overlay-text">Tap "Nearest" to find bunks near you</div>
      </div>
    </div>
  </div>
  <aside id="panel">
    <div class="panel-header">
      <h2>Stations <span id="count"></span></h2>
    </div>
    <div class="search-wrap">
      <input id="search" placeholder="Search bunk / road / brand..." />
      <button id="searchClear" class="search-clear hidden" title="Clear">✕</button>
    </div>
    <div id="serviceFilters">
      <button data-svc="food">🍲 Food</button>
      <button data-svc="restroom">🚻 Restroom</button>
      <button data-svc="air">💨 Air</button>
      <button data-svc="mechanic">🔧 Mechanic</button>
    </div>
    <div id="list"></div>
  </aside>
</main>

<!-- Mobile Bottom Nav -->
<nav id="bottomNav" class="bottom-nav">
  <button data-f="all" class="active" data-nav="fuel">⛽</button>
  <button data-f="petrol" data-nav="fuel">P</button>
  <button data-f="diesel" data-nav="fuel">D</button>
  <button data-f="cng" data-nav="fuel">C</button>
  <button data-f="ev" data-nav="fuel">⚡</button>
  <span class="nav-sep"></span>
  <button id="nearBtnMobile" data-nav="action">📍</button>
  <button id="truckModeMobile" data-nav="action">🚛</button>
  <button id="trendBtnMobile" data-nav="action">📈</button>
  <span class="nav-sep"></span>
  <button id="sosBtnMobile" class="btn-sos" data-nav="sos">🆘</button>
</nav>

<div id="scrollTop" class="scroll-top hidden" title="Back to top">↑</div>

<div id="modal" class="hidden">
  <div class="card modal-animate">
    <div class="modal-header">
      <h3 id="mName"></h3>
      <button id="mShare" class="btn-share-modal" title="Share on WhatsApp">📤</button>
      <button id="mCloseX" class="modal-close-x" title="Close">✕</button>
    </div>
    <p id="mAddr"></p>
    <div id="mPrices"></div>
    <div id="mWait"></div>
    <div id="mCngAlert"></div>
    <div class="modal-divider"></div>
    <label class="modal-label">Update availability (owner/demo):</label>
    <div class="modal-selects">
      <select id="mFuel">
        <option value="petrol">Petrol</option>
        <option value="diesel">Diesel</option>
        <option value="cng">CNG</option>
        <option value="ev">EV</option>
      </select>
      <select id="mStatus">
        <option value="Available">Available</option>
        <option value="Low">Low</option>
        <option value="Out">Out of stock</option>
      </select>
    </div>
    <div class="row">
      <button id="mSave" class="btn-green">Save</button>
      <button id="mDir" class="btn-yellow">Route here</button>
      <button id="mClose" class="btn-gray">Close</button>
    </div>
    <small class="sync-note" id="syncNote">🟢 Live via Supabase — owner updates sync to all.</small>
  </div>
</div>

<div id="trendModal" class="hidden">
  <div class="card modal-animate modal-wide">
    <div class="modal-header">
      <h3>Namakkal 10-day Price Trend</h3>
      <button id="trendCloseX" class="modal-close-x" title="Close">✕</button>
    </div>
    <canvas id="trendChart" height="220"></canvas>
    <p id="trendNote" class="trend-note"></p>
    <button id="trendClose" class="btn-gray full-w">Close</button>
  </div>
</div>

<div id="sosModal" class="hidden">
  <div class="card modal-animate modal-wide">
    <div class="modal-header">
      <h3>🆘 Highway SOS — Namakkal</h3>
      <button id="sosCloseX" class="modal-close-x" title="Close">✕</button>
    </div>
    <div class="sos-filters">
      <button data-sos="all" class="active">All</button>
      <button data-sos="hospital">🏥 Hospital</button>
      <button data-sos="mechanic">🔧 Mechanic</button>
      <button data-sos="puncture">🛞 Puncture</button>
      <button data-sos="police">🚔 Police</button>
    </div>
    <div id="sosList"></div>
    <button id="sosClose" class="btn-gray full-w">Close</button>
  </div>
</div>

<footer id="appFooter">
  <div class="footer-inner">
    <span id="lastUpdated">Last updated: —</span>
    <span class="footer-sep">·</span>
    <span>Data from <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap</a></span>
    <span class="footer-sep">·</span>
    <span>Tiles by <a href="https://openfreemap.org/" target="_blank" rel="noopener">OpenFreeMap</a></span>
  </div>
</footer>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://cdn.jsdelivr.net/npm/leaflet-routing-machine@3.2.12/dist/leaflet-routing-machine.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://unpkg.com/maplibre-gl@5/dist/maplibre-gl.js"></script>
<script src="https://unpkg.com/@maplibre/maplibre-gl-leaflet@0.1.4/leaflet-maplibre-gl.js"></script>
<script src="supabase-config.js?v=4"></script>
<script src="app.js?v=9"></script>
</body>
</html>
